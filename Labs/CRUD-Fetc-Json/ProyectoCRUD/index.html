<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD con Fetch, PHP OOP y MySQL</title>
    <!-- Bootstrap 5.3.0 CSS CDN (como especifica la guía) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <style>
        body { background-color: #f8f9fa; }
        .container { padding-top: 2rem; }
        .card-header { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center mb-4">Gestión de Productos</h1>

        <!-- Alerta de Bootstrap para mensajes (requerido por la guía) -->
        <div id="mensajeAlerta" class="alert alert-dismissible fade show" role="alert" style="display: none;">
            <span id="mensajeAlertaTexto"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Formulario para Guardar y Modificar Productos -->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="mb-0" id="formularioTitulo">Formulario de Producto</h5>
            </div>
            <div class="card-body">
                <form id="formularioProducto" onsubmit="return false;">
                    <input type="hidden" id="productoId" name="id">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="codigo" class="form-label">Código</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="codigo" name="codigo" required>
                                <button class="btn btn-outline-secondary" type="button" id="btnBuscar">Buscar</button>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="producto" class="form-label">Nombre del Producto</label>
                            <input type="text" class="form-control" id="producto" name="producto" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label">Precio</label>
                            <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" min="0" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary me-2" id="btnGuardar">Registrar</button>
                        <button type="button" class="btn btn-secondary" id="btnLimpiar" onclick="limpiarFormulario();">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla para Listar Productos -->
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">Listado de Productos</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Código</th>
                                <th scope="col">Producto</th>
                                <th scope="col">Precio</th>
                                <th scope="col">Cantidad</th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            <!-- Las filas se insertarán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap 5.3.0 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro script personalizado -->
    <script src="script.js"></script>
</body>
</html>
